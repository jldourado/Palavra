<!DOCTYPE html>
<html lang = 'pt'>
<head>
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width=device-width, initial-scale = 1.0">

    <link rel = "stylesheet" href = "style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&display=swap" rel="stylesheet">

    <script src = "palavras-facil.js"></script>
    <script src = "palavras.js"></script>

    <title>Palavra</title>
    
</head>
<body>

    <!-- logotopo -->
    <header>
        <div class = "logo">
            <span class = "logo-letra">P</span>
            <span class = "logo-letra amarelo">A</span>
            <span class = "logo-letra">L</span>
            <span class = "logo-letra verde">A</span>
            <svg class="logo-v" viewBox="0 0 40 50" xmlns="http://www.w3.org/2000/svg">
                <polygon points="0,0 13,0 20,34 27,0 40,0 23,50 17,50" fill="#1C1A16"/>
            </svg>
            <span class = "logo-letra">R</span>
            <span class = "logo-letra">A</span>
        </div>
    </header>

    <div id = "menu-dificuldade">
        <h2>Escolhe a dificuldade</h2>
        <div class="botoes-dificuldade">
            <button type = "button" onclick="iniciarComDificuldade('facil')">
                😊 Fácil
                <span>-> Verbos comuns</span>
            </button>
            <button type="button" onclick="iniciarComDificuldade('dificil')">
                💀 Difícil
                <span>-> Todas as palavras</span>
            </button>
        </div>
    </div>

    <main class = "jogo-container" id = "jogo" style = "display:none;">

        <div id = "display"></div>
        <div id = "mensagem"></div>
        <div id = "teclado"></div>
        <button id = "reiniciar" class = "botao-reiniciar" type = "button" onClick = "reiniciarJogo()">Jogar novamente</button>
    
    </main>
    
    <div id = "mensagem"></div>
    <script src = "palavras.js"></script>
    <script src = "ui.js"></script>
    <script src = "jogo.js"></script>

</body>
</html>
